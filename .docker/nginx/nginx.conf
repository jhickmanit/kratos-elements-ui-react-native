events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Serve assetlinks.json for Android passkey verification
        location /.well-known/assetlinks.json {
            alias /etc/nginx/assetlinks.json;
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
        }

        # Proxy Kratos API endpoints
        location /self-service/ {
            proxy_pass http://host.docker.internal:4433;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /sessions/ {
            proxy_pass http://host.docker.internal:4433;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Proxy everything else to Expo web app
        location / {
            proxy_pass http://host.docker.internal:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # WebSocket support for hot reload
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
